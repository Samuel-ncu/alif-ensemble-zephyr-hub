# System Stack & Memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Analog-to-Digital Converter (ADC) & Alif Analog HAL
CONFIG_ADC=y
CONFIG_USE_ALIF_HAL_ANALOG=y

# Floating Point Unit & Math Printing
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# GPIO for Status & RGB LEDs
CONFIG_GPIO=y

# SEGGER RTT Real-Time Console (Zero-Latency SW4=UART2 Switchless)
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=y

# Guard: Disable Ethos-U NPU to prevent undefined log level errors
CONFIG_ARM_ETHOS_U=n
