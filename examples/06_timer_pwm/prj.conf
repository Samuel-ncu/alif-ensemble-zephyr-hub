# Real-Time Transfer (SEGGER RTT) Console Configuration
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=y

# SEGGER RTT Interactive Down-Buffer for Keyboard Inputs
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048

# Hardware Universal Timer (UTIMER) & PWM Driver
CONFIG_PWM=y

# Disable Unused NPU for pure timer/PWM application
CONFIG_ARM_ETHOS_U=n

# Stack & Heap
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

